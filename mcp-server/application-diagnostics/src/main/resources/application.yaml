server:
  port: ${PORT:9090}
spring:
  application:
    name: application-diagnostics
  ai:
    mcp:
      server:
        enabled: true
        name: diagnostics-mcp-server
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        stdio: false
        streamable-http:
          mcp-endpoint: /mcp